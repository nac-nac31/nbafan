name: Mobil uygulama

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Capacitor
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android
      - name: APK derle (test sürümü)
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: fantezi-lig-android-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Capacitor
        working-directory: mobile
        run: |
          npm ci
          npx cap sync ios
      - name: Simülatör için derle (imzasız, sadece kontrol)
        working-directory: mobile/ios/App
        run: |
          xcodebuild -version
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -40
