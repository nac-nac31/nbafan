name: Günlük güncelleme

on:
  schedule:
    - cron: "0 6,12,18,22 * * *"   # günde 4 kez: TSİ 09:00, 15:00, 21:00, 01:00
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ESPN verisini çek
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: python scripts/fetch.py
      - name: İstatistikleri hesapla ve siteyi üret
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: python scripts/build.py
      - name: Haftanın hikayesi, uygulama dosyaları ve bildirimler
        env:
          NTFY_ENABLED: "1"
        run: python scripts/extras.py
      - name: Veriyi kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Veri güncellemesi $(date -u +%F)"
          git push
      - name: Diğer ligler (leagues.json, site/l/<lig no>/)
        continue-on-error: true
        timeout-minutes: 40
        run: |
          python scripts/build_all.py
          git add leagues
          git diff --cached --quiet || git commit -m "Diğer liglerin verisi $(date -u +%F)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
