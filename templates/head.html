<title>Fantasy 26-27 Lig Raporu</title>
<meta name="theme-color" content="#0F1420">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: phone-first app shell. Sticky header, view area, tab bar fixed at the bottom on phones and under the header on wide screens. */
:root{
  --bg:#EEF0F4; --surface:#FFFFFF; --surface-2:#F6F7FA; --ink:#121722; --muted:#626B7E; --line:#E0E3EA;
  --accent:#E0591F; --accent-ink:#FFFFFF; --cool:#3159C4;
  --good:#1C8A55; --bad:#C8372F; --head:#0F1420; --head-ink:#F2F4F8; --head-muted:#97A0B3;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --nav-h:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0E15; --surface:#151A24; --surface-2:#1B2130; --ink:#E9ECF2; --muted:#98A1B4; --line:#262D3B;
  --accent:#F2733D; --accent-ink:#1A0C05; --cool:#7E9EF2;
  --good:#4CC28A; --bad:#F0716A; --head:#0F1420; --head-ink:#F2F4F8; --head-muted:#97A0B3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0E15; --surface:#151A24; --surface-2:#1B2130; --ink:#E9ECF2; --muted:#98A1B4; --line:#262D3B;
  --accent:#F2733D; --accent-ink:#1A0C05; --cool:#7E9EF2;
  --good:#4CC28A; --bad:#F0716A; --head:#0F1420; --head-ink:#F2F4F8; --head-muted:#97A0B3; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 24px)}
button{font:inherit;color:inherit}
a{color:inherit}
.in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{background:var(--head);color:var(--head-ink);padding-top:env(safe-area-inset-top,0px)}
.top .in{padding-block:18px 20px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.brand{font-family:var(--f-data);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.top h1{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;margin:4px 0 0;text-transform:uppercase;letter-spacing:.01em}
.chip{font-family:var(--f-data);font-size:11px;color:var(--head-muted);text-align:right;line-height:1.5}
.chip b{display:inline-block;color:var(--head-ink);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:3px 8px;border-radius:999px;font-weight:500;margin-bottom:4px}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .row{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.02em}
nav.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current="page"]{color:var(--accent)}
nav.tabs a:focus-visible{outline:2px solid var(--accent);outline-offset:-4px;border-radius:8px}
@media (min-width:900px){
  body{padding-bottom:40px}
  nav.tabs{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line)}
  nav.tabs .row{height:52px;display:flex;gap:28px;justify-content:flex-start;padding-left:16px}
  nav.tabs a{flex-direction:row;gap:8px;font-size:14px;border-bottom:2px solid transparent}
  nav.tabs a[aria-current="page"]{border-bottom-color:var(--accent)}
  nav.tabs a svg{width:18px;height:18px}
}

/* views */
main .in{padding-block:20px;display:flex;flex-direction:column;gap:24px}
.view{display:flex;flex-direction:column;gap:24px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h2{font-family:var(--f-display);font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.02em;margin:0}
.hint{font-size:13px;color:var(--muted);margin:0;max-width:62ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}

/* logos */
.logo{flex:none;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;
  font-family:var(--f-display);font-weight:700;color:var(--muted);text-transform:uppercase}
.logo img{width:100%;height:100%;object-fit:cover;display:block}

/* ranking list */
.rank-list{list-style:none;margin:0;padding:0}
.rank-list li+li{border-top:1px solid var(--line)}
.trow{display:grid;grid-template-columns:28px 40px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 14px;text-decoration:none}
.trow:hover{background:var(--surface-2)}
.trow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.trow .n{font-family:var(--f-display);font-weight:800;font-size:22px;text-align:center}
.trow .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .sub{font-family:var(--f-data);font-size:11.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.trow .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pbar{width:64px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.pill{display:inline-flex;align-items:center;font-family:var(--f-data);font-size:11px;padding:2px 7px;border-radius:999px;white-space:nowrap}
.pill.up{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.pill.down{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.pill.flat{background:var(--surface-2);color:var(--muted)}

/* leader hero */
.leader{display:flex;gap:16px;align-items:center;padding:16px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 18%,var(--surface)),var(--surface) 70%);text-decoration:none}
.leader .lab{font-family:var(--f-data);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.leader .big{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.05}
.leader .why{font-size:13px;color:var(--muted)}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .k{font-family:var(--f-data);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .s{font-size:12px;color:var(--muted)}

/* awards */
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.aw{display:flex;gap:12px;align-items:center;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-decoration:none;min-width:0}
.aw .lab{font-family:var(--f-data);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.aw .who{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aw .why{font-size:12px;color:var(--muted)}
.aw>div{min-width:0}

/* luck chart */
.luck{padding:14px;display:flex;flex-direction:column;gap:8px}
.lrow{display:grid;grid-template-columns:28px minmax(0,1fr) 54px;align-items:center;gap:10px;text-decoration:none}
.lrow .bar{grid-column:1/-1;position:relative;height:10px;margin-top:-2px}
.lrow .bar::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted);opacity:.6}
.lrow .bar i{position:absolute;top:1px;height:8px;border-radius:2px}
.lrow .nm{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .v{font-family:var(--f-data);font-size:12px;text-align:right}
.axis{display:flex;justify-content:space-between;font-family:var(--f-data);font-size:10.5px;color:var(--muted);padding-top:4px;border-top:1px solid var(--line)}

/* events */
.ev{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px}
.ev+.ev{border-top:1px solid var(--line)}
.ev .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .sc{font-family:var(--f-display);font-weight:800;font-size:24px}

/* week chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* matchup */
.mu{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;padding:14px}
.mu+.mu{border-top:1px solid var(--line)}
.mu .side{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none}
.mu .side.r{flex-direction:row-reverse;text-align:right}
.mu .side>div{min-width:0}
.mu .nm{font-weight:600;font-size:13.5px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mu .ap{font-family:var(--f-data);font-size:11px;color:var(--muted)}
.mu .sc{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:.02em;white-space:nowrap}
.mu .sc .w{color:var(--accent)}
.mu .loser .nm{color:var(--muted);font-weight:500}

/* heat tables */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;white-space:nowrap}
th{font-family:var(--f-data);font-size:10.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}
th:first-child,td:first-child{text-align:left;padding-left:14px;position:sticky;left:0;background:var(--surface);z-index:1}
td.c{text-align:center;font-family:var(--f-data);font-size:12.5px;min-width:38px;border-radius:6px}
td.tn{font-weight:600;font-size:13px;max-width:150px;overflow:hidden;text-overflow:ellipsis}
tbody tr+tr td{border-top:2px solid var(--surface)}

/* team grid */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px}
.tcard{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;text-decoration:none;text-align:center;min-width:0}
.tcard:hover{border-color:var(--accent)}
.tcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tcard .nm{font-weight:600;font-size:13.5px;line-height:1.2}
.tcard .sub{font-family:var(--f-data);font-size:11px;color:var(--muted)}

/* profile */
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);text-decoration:none}
.phead{display:flex;gap:16px;align-items:center}
.phead .nm{font-family:var(--f-display);font-weight:800;font-size:32px;line-height:1;text-wrap:balance}
.phead .sub{font-size:13px;color:var(--muted);margin-top:4px}
.radar{display:flex;justify-content:center;padding:12px}
.radar svg{width:100%;max-width:340px;height:auto}
.radar text{font-family:var(--f-data);font-size:11px;fill:var(--muted)}
.radar .lbl-strong{fill:var(--ink);font-weight:600}
.res{display:grid;grid-template-columns:34px 32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 14px;text-decoration:none}
.res+.res{border-top:1px solid var(--line)}
.res .wk{font-family:var(--f-data);font-size:11px;color:var(--muted)}
.res .nm{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res small{display:block;font-size:11.5px;color:var(--muted)}
.res .sc{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:20px}
.gm{font-family:var(--f-data);font-size:10.5px;font-weight:500;width:22px;height:22px;border-radius:6px;display:grid;place-items:center}
.gm.G{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.gm.M{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.gm.B{background:var(--surface-2);color:var(--muted)}

footer .in{font-size:12px;color:var(--muted);padding-block:8px 0}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .18s ease-out}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
