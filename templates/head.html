<title>Fantasy 26-27 Lig Raporu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: scoreboard-style single column; each section a ruled band with a condensed caps heading */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --ink:#141824; --muted:#5D6578; --line:#DCE0E8;
  --accent:#D9541E; --accent-soft:#FBE3D7; --cool:#2E56B8; --cool-soft:#DCE5FA;
  --good:#1F8A57; --bad:#C2362F;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1117; --surface:#161B24; --ink:#E9ECF2; --muted:#9AA3B5; --line:#2A3140;
  --accent:#F07440; --accent-soft:#3A2218; --cool:#7C9DF0; --cool-soft:#1C2742;
  --good:#4CC28A; --bad:#F0716A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1117; --surface:#161B24; --ink:#E9ECF2; --muted:#9AA3B5; --line:#2A3140;
  --accent:#F07440; --accent-soft:#3A2218; --cool:#7C9DF0; --cool-soft:#1C2742;
  --good:#4CC28A; --bad:#F0716A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:40px}
header{padding-block:32px 8px;border-bottom:3px solid var(--ink);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.eyebrow{font-family:var(--f-data);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,7vw,68px);line-height:.95;margin:6px 0 0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.meta{font-family:var(--f-data);font-size:12px;color:var(--muted);text-align:right}
h2{font-family:var(--f-display);font-weight:700;font-size:28px;text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:4px 0 0;max-width:65ch}
section{display:flex;flex-direction:column;gap:16px}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-family:var(--f-data);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--f-data);font-size:13px}
.rk{font-family:var(--f-display);font-weight:800;font-size:22px;width:40px}
.team{font-weight:600}
.bar{width:120px;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.pill{display:inline-block;font-family:var(--f-data);font-size:12px;padding:2px 8px;border-radius:999px}
.pill.up{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.down{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.flat{background:var(--line);color:var(--muted)}
.luck{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:6px}
.lrow{display:grid;grid-template-columns:minmax(0,190px) 1fr 64px;align-items:center;gap:12px;font-size:14px}
.lrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ltrack{position:relative;height:18px}
.ltrack::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--muted)}
.ltrack i{position:absolute;top:3px;height:12px;border-radius:2px}
.lrow .v{font-family:var(--f-data);font-size:12px;text-align:right}
.axis{display:grid;grid-template-columns:minmax(0,190px) 1fr 64px;gap:12px;font-family:var(--f-data);font-size:11px;color:var(--muted)}
.axis div{display:flex;justify-content:space-between}
.heat td.c{text-align:center;font-family:var(--f-data);font-size:13px;min-width:44px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{font-family:var(--f-display);font-size:20px;text-transform:uppercase;margin:0;letter-spacing:.02em}
.ev{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:baseline;padding-top:10px;border-top:1px solid var(--line)}
.ev .wk{font-family:var(--f-data);font-size:11px;color:var(--muted)}
.ev .sc{font-family:var(--f-display);font-weight:700;font-size:22px}
.ev .tx{min-width:0}
.ev small{display:block;color:var(--muted)}
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:16px}
.aw{border-top:3px solid var(--accent);padding-top:10px;display:flex;flex-direction:column;gap:2px}
.aw .lab{font-family:var(--f-data);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.aw .who{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.1}
.aw .why{font-size:13px;color:var(--muted)}
footer{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px;max-width:75ch}
@media (max-width:560px){.lrow,.axis{grid-template-columns:110px 1fr 52px}.bar{width:70px}}
</style>
