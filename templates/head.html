<title>Fantasy 26-27 Lig Raporu</title>
<meta name="theme-color" content="#122A1E">
<style>
/* Layout: phone-first app shell. Sticky header, view area, tab bar fixed at the bottom on phones and under the header on wide screens. */
:root{
  --bg:#F2F3F1; --surface:#FFFFFF; --surface-2:#F4F5F3; --ink:#141A16; --muted:#6B746E; --line:#E2E5E2;
  --accent:#1E7449; --accent-ink:#FFFFFF; --cool:#B8502A;
  --good:#1E7449; --bad:#B8372D; --head:#F2F3F1; --head-ink:#141A16; --head-muted:#6B746E;
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-data:var(--f-body);
  --nav-h:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0C0B; --surface:#1A1C1B; --surface-2:#232624; --ink:#ECEFED; --muted:#949B97; --line:#2C302E;
  --accent:#3DB97C; --accent-ink:#06170D; --cool:#E5844F;
  --good:#3DB97C; --bad:#EF7A6C; --head:#0B0C0B; --head-ink:#ECEFED; --head-muted:#949B97; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0C0B; --surface:#1A1C1B; --surface-2:#232624; --ink:#ECEFED; --muted:#949B97; --line:#2C302E;
  --accent:#3DB97C; --accent-ink:#06170D; --cool:#E5844F;
  --good:#3DB97C; --bad:#EF7A6C; --head:#0B0C0B; --head-ink:#ECEFED; --head-muted:#949B97; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 24px)}
button{font:inherit;color:inherit}
a{color:inherit}
.in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:relative;overflow:hidden;background:var(--head);color:var(--head-ink);padding-top:env(safe-area-inset-top,0px)}
.top::after{content:"";position:absolute;right:-80px;top:-60px;width:260px;height:260px;border:2px solid rgba(255,255,255,.09);border-radius:50%;box-shadow:0 0 0 46px rgba(255,255,255,.025),0 0 0 48px rgba(255,255,255,.07);pointer-events:none}
.top .in{position:relative;z-index:1}
.top .in{padding-block:18px 20px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.brand{font-family:var(--f-data);font-size:11px;color:var(--head-muted)}
.top h1{white-space:nowrap;font-family:var(--f-display);font-weight:800;font-size:clamp(34px,8vw,48px);line-height:1;margin:4px 0 0;}
.chip{font-family:var(--f-data);font-size:11px;color:var(--head-muted);text-align:right;line-height:1.5}
.chip b{display:inline-block;color:var(--head-ink);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:3px 8px;border-radius:999px;font-weight:500;margin-bottom:4px}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .row{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(8,1fr);height:var(--nav-h)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600;}
nav.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current="page"]{color:var(--accent)}
nav.tabs a:focus-visible{outline:2px solid var(--accent);outline-offset:-4px;border-radius:8px}
@media (min-width:900px){
  body{padding-bottom:40px}
  nav.tabs{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line)}
  nav.tabs .row{height:52px;display:flex;gap:24px;justify-content:flex-start;padding-left:16px}
  nav.tabs a{flex-direction:row;gap:8px;font-size:14px;white-space:nowrap;border-bottom:2px solid transparent}
  nav.tabs a[aria-current="page"]{border-bottom-color:var(--accent)}
  nav.tabs a svg{width:18px;height:18px}
}

/* views */
main .in{padding-block:20px;display:flex;flex-direction:column;gap:24px}
.view{display:flex;flex-direction:column;gap:24px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h2{font-family:var(--f-display);font-weight:700;font-size:24px;margin:0}
.hint{font-size:13px;color:var(--muted);margin:0;max-width:62ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(15,20,32,.04),0 6px 18px -10px rgba(15,20,32,.12)}

/* logos */
.logo{flex:none;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;
  font-family:var(--f-display);font-weight:700;color:var(--muted);text-transform:uppercase}
.logo img{width:100%;height:100%;object-fit:cover;display:block}

/* ranking list */
.rank-list{list-style:none;margin:0;padding:0}
.rank-list li+li{border-top:1px solid var(--line)}
.trow{display:grid;grid-template-columns:28px 40px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 14px;text-decoration:none}
.trow:hover{background:var(--surface-2)}
.trow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.trow .n{font-family:var(--f-display);font-weight:800;font-size:22px;text-align:center}
.trow .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .sub{font-family:var(--f-data);font-size:11.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.trow .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pbar{width:64px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.pill{display:inline-flex;align-items:center;font-family:var(--f-data);font-size:11px;padding:2px 7px;border-radius:999px;white-space:nowrap}
.pill.up{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.pill.down{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.pill.flat{background:var(--surface-2);color:var(--muted)}

/* leader hero */
.leader{display:flex;gap:16px;align-items:center;padding:16px;background:var(--surface);border-top:4px solid var(--accent);text-decoration:none}
.leader .lab{font-family:var(--f-data);font-size:11px;color:var(--accent)}
.leader .big{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.05}
.leader .why{font-size:13px;color:var(--muted)}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .k{font-family:var(--f-data);font-size:10.5px;color:var(--muted)}
.tile .v{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .s{font-size:12px;color:var(--muted)}

/* awards */
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.aw{display:flex;gap:12px;align-items:center;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-decoration:none;min-width:0}
.aw .lab{font-family:var(--f-data);font-size:10.5px;color:var(--accent)}
.aw .who{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aw .why{font-size:12px;color:var(--muted)}
.aw>div{min-width:0}

/* luck chart */
.luck{padding:14px;display:flex;flex-direction:column;gap:8px}
.lrow{display:grid;grid-template-columns:28px minmax(0,1fr) 54px;align-items:center;gap:10px;text-decoration:none}
.lrow .bar{grid-column:1/-1;position:relative;height:10px;margin-top:-2px}
.lrow .bar::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted);opacity:.6}
.lrow .bar i{position:absolute;top:1px;height:8px;border-radius:2px}
.lrow .nm{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .v{font-family:var(--f-data);font-size:12px;text-align:right}
.axis{display:flex;justify-content:space-between;font-family:var(--f-data);font-size:10.5px;color:var(--muted);padding-top:4px;border-top:1px solid var(--line)}

/* events */
.ev{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px}
.ev+.ev{border-top:1px solid var(--line)}
.ev .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .sc{font-family:var(--f-display);font-weight:800;font-size:24px}

/* week chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* matchup */
.mu{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;padding:14px}
.mu+.mu{border-top:1px solid var(--line)}
.mu .side{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none}
.mu .side.r{flex-direction:row-reverse;text-align:right}
.mu .side>div{min-width:0}
.mu .nm{font-weight:600;font-size:13.5px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mu .ap{font-family:var(--f-data);font-size:11px;color:var(--muted)}
.mu .sc{font-family:var(--f-display);font-weight:800;font-size:26px;white-space:nowrap}
.mu .sc span:first-child{color:var(--accent)}
.mu .sc span:last-child{color:var(--cool)}
.mu .sc:has(.w) span:not(.w){opacity:.45}
.mu .side:not(.r) .nm{color:var(--accent)}
.mu .side.r .nm{color:var(--cool)}
.mu .loser .nm{font-weight:500;opacity:.7}

/* heat tables */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;white-space:nowrap}
th{font-family:var(--f-data);font-size:10.5px;font-weight:500;color:var(--muted);text-align:center}
th:first-child,td:first-child{text-align:left;padding-left:14px;position:sticky;left:0;background:var(--surface);z-index:1}
td.c{text-align:center;font-family:var(--f-data);font-size:12.5px;min-width:38px;border-radius:6px}
td.tn{font-weight:600;font-size:13px;max-width:150px;overflow:hidden;text-overflow:ellipsis}
tbody tr+tr td{border-top:2px solid var(--surface)}

/* team grid */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px}
.tcard{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;text-decoration:none;text-align:center;min-width:0}
.tcard:hover{border-color:var(--accent)}
.tcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tcard .nm{font-weight:600;font-size:13.5px;line-height:1.2}
.tcard .sub{font-family:var(--f-data);font-size:11px;color:var(--muted)}

/* profile */
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);text-decoration:none}
.phead{display:flex;gap:16px;align-items:center}
.phead .nm{font-family:var(--f-display);font-weight:800;font-size:32px;line-height:1;text-wrap:balance}
.phead .sub{font-size:13px;color:var(--muted);margin-top:4px}
.radar{display:flex;justify-content:center;padding:12px}
.radar svg{width:100%;max-width:340px;height:auto}
.radar text{font-family:var(--f-data);font-size:11px;fill:var(--muted)}
.radar .lbl-strong{fill:var(--ink);font-weight:600}
.res{display:grid;grid-template-columns:34px 32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 14px;text-decoration:none}
.res+.res{border-top:1px solid var(--line)}
.res .wk{font-family:var(--f-data);font-size:11px;color:var(--muted)}
.res .nm{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res small{display:block;font-size:11.5px;color:var(--muted)}
.res .sc{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:20px}
.gm{font-family:var(--f-data);font-size:10.5px;font-weight:500;width:22px;height:22px;border-radius:6px;display:grid;place-items:center}
.gm.G{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.gm.M{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.gm.B{background:var(--surface-2);color:var(--muted)}

/* home */
.live{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-data);font-size:11px;color:var(--accent)}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}
@media (prefers-reduced-motion:no-preference){.live::before{animation:pulse 1.8s infinite}@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}}
.hero{display:flex;flex-direction:column;gap:6px}
.hero h2{font-size:clamp(30px,7vw,40px);line-height:1}
.heads{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.head{display:flex;gap:12px;align-items:center;padding:14px;text-decoration:none;min-width:0}
.head .lab{font-family:var(--f-data);font-size:10.5px;color:var(--accent)}
.head .t{font-weight:700;line-height:1.25}
.head .s{font-size:12.5px;color:var(--muted)}
.head>div{min-width:0}
.game{border:0;margin:0}
.game+.game{border-top:1px solid var(--line)}
.game summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:10px;padding:14px}
.game summary::-webkit-details-marker{display:none}
.game summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.game .mu{padding:0}
.strip{display:grid;grid-template-columns:repeat(9,1fr);gap:3px}
.strip span{height:22px;border-radius:4px;display:grid;place-items:center;font-family:var(--f-data);font-size:9.5px;font-weight:500;}
.strip .H{background:var(--accent);color:var(--accent-ink)}
.strip .A{background:var(--cool);color:var(--accent-ink)}
.strip .T{background:var(--surface-2);color:var(--muted)}
.strip .cl{outline:2px dashed color-mix(in srgb,var(--ink) 55%,transparent);outline-offset:-2px}
.gmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.gmeta .more::after{content:" ▾"}
.game[open] .gmeta .more::after{content:" ▴"}
.cats-t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin:0 14px 14px;width:calc(100% - 28px)}
.cats-t td{padding:6px 4px;border-top:1px solid var(--line);font-family:var(--f-data);font-size:12.5px;text-align:center;position:static;background:none}
.cats-t td:first-child{text-align:left;padding-left:0}
.cats-t td:last-child{text-align:right}
.cats-t td.mid{color:var(--muted);font-size:11px}
.cats-t .win{color:var(--ink);font-weight:600}
.cats-t td:nth-child(1).win{color:var(--accent)}
.cats-t td:nth-child(3).win{color:var(--cool)}
.cats-t .lose{color:var(--muted)}
.cats-t .cl{color:var(--accent);font-size:10px}
.mini{list-style:none;margin:0;padding:0}
.mini li+li{border-top:1px solid var(--line)}
.mini a{display:grid;grid-template-columns:24px 32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;text-decoration:none}
.mini .n{font-family:var(--f-display);font-weight:800;font-size:18px;text-align:center}
.mini .nm{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .v{font-family:var(--f-data);font-size:12px;color:var(--muted)}
.two{display:grid;gap:24px}
@media (min-width:700px){.two{grid-template-columns:1fr 1fr}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
/* history */
.old{display:block;font-family:var(--f-body);font-size:11px;font-weight:400;color:var(--muted);text-transform:none;letter-spacing:0;line-height:1.3;margin-top:1px;white-space:normal}
.newb{display:inline-block;vertical-align:2px;margin-left:6px;font-family:var(--f-data);font-size:9.5px;font-weight:500;padding:2px 6px;border-radius:999px;background:color-mix(in srgb,var(--cool) 15%,transparent);color:var(--cool)}
.gone{opacity:.6}
.hist td{border-top:1px solid var(--line);font-size:13px;padding:10px 8px;text-align:right;font-family:var(--f-data)}
.hist th{text-align:right;padding:10px 8px}
.hist th:first-child,.hist td:first-child{text-align:left;font-family:var(--f-body);white-space:normal;min-width:150px}
.hist td:first-child b{font-weight:600}
.champ{color:var(--accent);font-weight:600}
/* my team */
button.tcard{font:inherit;color:inherit;cursor:pointer;width:100%}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.cats-t.my td:last-child{text-align:right;width:84px}
.pill.chase{background:color-mix(in srgb,var(--cool) 16%,transparent);color:var(--cool)}
.tips{padding:0 14px 14px;display:flex;flex-direction:column;gap:6px}
.tips p{margin:0;font-size:13px;line-height:1.45;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.pl{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:12px;align-items:center;padding:11px 14px}
.pl+.pl{border-top:1px solid var(--line)}
.pl .nm{font-weight:600;font-size:14px}
.pl small{display:block;font-size:11.5px;color:var(--muted);line-height:1.4}
.pv{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-family:var(--f-data);font-size:13px}
.pos{color:var(--good)}.neg{color:var(--bad)}
.vbar{position:relative;width:88px;height:6px;border-radius:3px;background:var(--line)}
.vbar::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted)}
.vbar i{position:absolute;top:0;height:100%;border-radius:3px;background:var(--accent)}
@media (max-width:420px){nav.tabs a{font-size:10px}}
/* players */
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters input,.filters select{font:inherit;font-size:13.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.filters input{flex:1 1 180px}
.filters select{flex:1 1 140px}
.filters :focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ptab td.pnm{min-width:170px;max-width:190px;white-space:normal;padding-block:9px;box-shadow:1px 0 0 var(--line)}
.pnw{display:flex;gap:8px;align-items:flex-start}
.ptab td.pnm b{font-weight:600;font-size:13.5px}
.ptab td.pnm small{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.prk{font-family:var(--f-display);font-weight:800;font-size:17px;min-width:26px;text-align:right;color:var(--muted)}
.ptab td.val{font-weight:600;font-size:13px;background:none}
.ptab td.c{min-width:44px;font-size:11.5px}
.ptab tbody tr+tr td{border-top:2px solid var(--surface)}
/* prediction */
.wb{display:flex;flex-direction:column;gap:5px}
.wbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--muted)}
.wbl b{font-family:var(--f-display);font-weight:800;font-size:17px;color:var(--ink)}
.wbl>span:first-child,.wbl>span:first-child b{color:var(--accent)}
.wbl>span:last-child,.wbl>span:last-child b{color:var(--cool)}
.wbm{font-size:11px;text-align:center}
.wbb{height:8px;border-radius:4px;background:var(--cool);overflow:hidden}
.wbb i{display:block;height:100%;background:var(--accent);border-right:2px solid var(--surface)}
.game .wb,.panel>.wb{padding:0}
.panel>.wb{padding:0 14px 12px}
.pj{font-size:10.5px;color:var(--muted)}
.cats-t thead td{font-size:10px;color:var(--muted);border-top:0}
.hr{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.chip{white-space:nowrap}
.lang{font-family:var(--f-data);font-size:11px;color:var(--head-ink);text-decoration:none;border:1px solid rgba(255,255,255,.25);border-radius:6px;padding:3px 8px}
.lang:hover,.lang:focus-visible{background:rgba(255,255,255,.1);outline:none}
footer .in{font-size:12px;color:var(--muted);padding-block:8px 0}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .18s ease-out}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
.odds{padding:4px 0}
.orow{display:grid;grid-template-columns:28px minmax(0,1fr) 44px 44px 48px;align-items:center;gap:6px;padding:9px 12px;text-decoration:none;border-top:1px solid var(--line)}
.orow:first-child{border-top:0}
a.orow:hover{background:var(--surface-2)}
.orow .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.orow .sub{font-family:var(--f-data);font-size:11px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orow.oh{font-family:var(--f-data);font-size:10px;color:var(--muted);padding-top:8px;padding-bottom:6px}
.orow.oh span:nth-child(n+3){text-align:center}
.ov{font-family:var(--f-data);font-size:12.5px;text-align:center;padding:5px 0;border-radius:6px;font-variant-numeric:tabular-nums}
.ov.b{font-weight:700}


/* ---- Paylaşım / bildirim / uygulama ---- */
.chip2{font-family:var(--f-data);font-size:11px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.sbody{padding:16px;display:flex;flex-direction:column;gap:10px}
.sbody p{margin:0;font-size:14.5px;line-height:1.5}
.sbody p.lead{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.15;text-transform:none}
.sbody p+p{padding-top:10px;border-top:1px dashed var(--line)}
.sact{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.sbtn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:10px 16px;font:600 14px var(--f-body);background:var(--accent);color:var(--accent-ink);cursor:pointer;text-decoration:none}
.sbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sbtn.wa{background:#25D366;color:#06170D}
.sbtn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.sbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.shm{position:fixed;inset:0;z-index:50;background:rgba(5,10,7,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.shc{background:var(--surface);border-radius:18px;padding:14px;max-width:440px;width:100%;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.shc img{width:100%;height:auto;border-radius:10px;display:block}
.inst{display:flex;align-items:center;gap:12px;padding:12px 14px;position:relative}
.inst img{border-radius:10px;flex:none}
.inst div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.inst small{font-size:12px;color:var(--muted)}
.inst .x{background:none;border:0;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:4px}
.ntf ol{margin:0;padding:14px 14px 14px 34px;display:flex;flex-direction:column;gap:12px}
.ntf li{font-size:14px}
.ntrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:6px}
.ntrow code{font-family:var(--f-data);font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:4px 8px;word-break:break-all}
/* ---- Eğlence ---- */
.seg{display:inline-flex;align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 14px;font-family:var(--f-data);font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.fjump{margin-top:-4px}
.fjump button{padding:6px 12px;font-size:12.5px}
.feat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fcard{position:relative;border-radius:16px;padding:14px 14px 16px;min-width:0;overflow:hidden;display:flex;flex-direction:column;gap:3px;border:1px solid var(--line);background:var(--surface)}
.fcard.dark{background:linear-gradient(155deg,color-mix(in srgb,var(--accent) 24%,var(--head)),var(--head) 70%);border-color:color-mix(in srgb,var(--accent) 25%,transparent);color:var(--head-ink)}
.fcard.acc{background:color-mix(in srgb,var(--accent) 13%,var(--surface));border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.fcard.cool{background:color-mix(in srgb,var(--cool) 12%,var(--surface));border-color:color-mix(in srgb,var(--cool) 30%,transparent)}
.fcard .fl{font-family:var(--f-data);font-size:10px;color:var(--accent);padding-right:38px}
.fcard.dark .fl{color:color-mix(in srgb,var(--accent) 55%,#fff)}
.fcard.cool .fl{color:var(--cool)}
.fcard .fb{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:.95;margin-top:6px;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.fcard .fb small{font-family:var(--f-body);font-size:12px;font-weight:600;opacity:.7}
.fcard .fb .arr{font-size:28px;opacity:.55;margin:0 2px}
.fcard .fn{font-weight:700;font-size:15px;line-height:1.2;margin-top:4px;overflow:hidden;text-overflow:ellipsis}
.fcard .fs{font-size:12px;line-height:1.35;color:var(--muted)}
.fcard.dark .fs{color:var(--head-muted)}
.fcard .flogo{position:absolute;top:10px;right:10px}
.fh3{font-family:var(--f-display);font-weight:700;font-size:18px;margin:8px 0 0}
.frow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.panel>.frow:first-child{border-top:0}
.frow .rk{font-family:var(--f-display);font-weight:800;font-size:20px;width:20px;text-align:center;color:var(--muted);flex:none}
.frow .fm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.frow .fm .nm,.frow .fm b{font-weight:600;text-decoration:none;color:inherit;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow small{font-size:12px;color:var(--muted);line-height:1.35}
.frow small.line{font-family:var(--f-data);font-size:11px}
.frow .pill{white-space:normal;text-align:left;margin-top:2px}
.frow .fv{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none;font-family:var(--f-data);font-variant-numeric:tabular-nums}
.frow .fv b{font-size:15px}
.hb{display:block;width:72px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.hb i{display:block;height:100%;border-radius:3px}
.empty{display:flex;gap:14px;align-items:center;padding:18px}
.empty svg{width:34px;height:34px;flex:none;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.empty p{margin:0;color:var(--muted);font-size:14px}
.trade{padding:14px;display:flex;flex-direction:column;gap:10px}
.tbadge{align-self:flex-start;font-family:var(--f-data);font-size:10.5px;background:var(--cool);color:#fff;padding:3px 8px;border-radius:6px}
.tdate{font-family:var(--f-data);font-size:11px;color:var(--muted)}
.tsides{display:grid;gap:10px}
.tside{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:12px;background:var(--surface-2)}
.tside .th{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tgot{font-size:13px}
.tnum{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.tnum b{font-family:var(--f-data);color:var(--ink)}
.ft{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:inherit;font-weight:600;min-width:0}
.ft span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grade{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1;min-width:40px;text-align:center;padding:6px 6px 4px;border-radius:10px;flex:none}
.grade.big{font-size:30px;min-width:54px;padding:10px 6px 8px}
.grade.ga{background:var(--accent);color:var(--accent-ink)}
.grade.gb{background:color-mix(in srgb,var(--accent) 18%,var(--surface-2));color:var(--ink)}
.grade.gc{background:color-mix(in srgb,var(--cool) 20%,var(--surface-2));color:var(--cool)}
.grade.gd{background:var(--bad);color:#fff}
.vs{display:grid;grid-template-columns:minmax(0,1fr) 120px minmax(0,1fr);align-items:center;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.panel>.vs:first-child{border-top:0}
.vs-t{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:inherit;font-weight:600;font-size:12.5px;text-align:center;min-width:0}
.vs-t span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vs-m{display:flex;flex-direction:column;align-items:center;gap:5px}
.vs-m small{font-family:var(--f-data);font-size:10.5px;color:var(--muted);text-align:center}
.vs-r{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1;color:var(--muted)}
.vs-r .lead{color:var(--accent)}
.vs-r .lead.r{color:var(--cool)}
.vs-b{width:100%;height:6px;border-radius:3px;background:var(--cool);overflow:hidden}
.vs-b i{display:block;height:100%;background:var(--accent)}
.blows{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:8px}
.blow{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.blow .bs{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;color:var(--accent);flex:none;min-width:56px}
.blow .fm{min-width:0;display:flex;flex-direction:column}
.blow b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blow small{font-size:12px;color:var(--muted)}
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rtile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0;border-top:3px solid var(--accent)}
.rtile.g{border-top-color:var(--cool)}
.rtile .k{font-family:var(--f-data);font-size:10.5px;color:var(--muted)}
.rtile .v{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1.05;font-variant-numeric:tabular-nums}
.rtile .s{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtile .lo{font-size:11px;color:var(--muted);line-height:1.3}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:8px}
.dcard{display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-decoration:none;color:inherit;min-width:0}
.dcard .fm{min-width:0;display:flex;flex-direction:column;gap:2px}
.dcard .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dcard small{font-size:11.5px;color:var(--muted);line-height:1.3}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px}
.pcard{display:flex;flex-direction:column;gap:8px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;text-decoration:none;color:inherit}
.pcard .ph{display:flex;gap:10px;align-items:center;min-width:0}
.pcard .pl1{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1;color:var(--accent)}
.pcard .nm{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard p{margin:0;font-size:13px}
.pc{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:11px;color:var(--muted)}
.pc span:not(.pill){margin:0 2px 0 4px}
.pc span:first-child{margin-left:0}
@media (min-width:700px){.feat{grid-template-columns:repeat(3,minmax(0,1fr))}.rgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.tsides{grid-template-columns:1fr 1fr}}

/* ===== Ürün iskeleti (tasarım yönü B: uygulama). Yukarıdaki kuralları ezer. ===== */
body{font-size:15px;-webkit-font-smoothing:antialiased}
.top{background:color-mix(in srgb,var(--bg) 88%,transparent);color:var(--ink);position:sticky;top:0;z-index:25;
  -webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);border-bottom:.5px solid var(--line)}
.top::after{display:none}
.top .in{padding-block:10px;align-items:center}
.top .id{display:flex;align-items:center;gap:10px;min-width:0}
.mark{flex:none;width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.mark svg{width:18px;height:18px;stroke:var(--accent-ink);fill:none;stroke-width:1.8}
.brand{font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--muted);line-height:1.2}
.top h1{font-family:var(--f-body);font-size:16px;font-weight:700;margin:0;text-transform:none;letter-spacing:-.01em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr{flex-direction:row;align-items:center;gap:10px}
.chip{color:var(--muted);font-size:12px;text-align:right;line-height:1.3}
.chip b{display:block;background:none;border:0;padding:0;margin:0;color:var(--ink);font-weight:600}
.lang{color:var(--muted);border:1px solid var(--line);font-family:var(--f-body);font-size:12px;font-weight:600}
.lang:hover,.lang:focus-visible{background:var(--surface-2)}
nav.tabs{background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);border-top:.5px solid var(--line)}
nav.tabs .row{grid-template-columns:repeat(5,1fr);height:56px}
nav.tabs a{font-size:10.5px;font-weight:500;gap:2px}
nav.tabs a svg{width:24px;height:24px;stroke-width:1.7}
@media (min-width:900px){
  .top{position:relative;border-bottom:0;background:var(--bg)}
  nav.tabs{top:0;background:color-mix(in srgb,var(--bg) 90%,transparent);border-bottom:.5px solid var(--line)}
  nav.tabs .row{height:48px;gap:4px;padding-left:max(16px,env(safe-area-inset-left,0px))}
  nav.tabs a{font-size:14px;font-weight:600;padding:0 12px;border-bottom:0;border-radius:8px;height:34px;align-self:center}
  nav.tabs a[aria-current="page"]{background:var(--surface);box-shadow:0 0 0 .5px var(--line)}
}
main .in{padding-block:16px 8px;gap:28px}
.view{gap:28px}
.sec{gap:8px}
h2{font-family:var(--f-body);font-size:20px;font-weight:700;letter-spacing:-.015em;text-transform:none;line-height:1.25}
.hero h2{font-size:clamp(26px,6vw,32px);letter-spacing:-.02em}
.hint{font-size:13.5px;line-height:1.45}
.panel{border:0;border-radius:12px;box-shadow:none}
.tile,.aw,.tcard,.fcard,.head{border-radius:12px;border-color:transparent;box-shadow:none}
.leader{border-top:0;border-radius:12px}
.lab,.k,.fl,.tile .k,.aw .lab,.head .lab,.leader .lab{font-size:12px;font-weight:600}
th,.orow.oh,.cats-t thead td{font-size:11.5px;font-weight:600}
.live{color:var(--muted);font-size:13px;font-weight:600}
.live::before{display:none}
.trow .n,.mini .n,.prk,.frow .rk{font-family:var(--f-body);font-weight:700;font-size:16px;color:var(--muted)}
.mu .sc,.ev .sc,.res .sc,.tile .v,.leader .big,.phead .nm,.fcard .fb,.wbl b{font-family:var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.mu .sc{font-size:24px;font-weight:700}
.chips button{border-color:var(--line);font-weight:600}
/* alt gezinme: Lig ve Pazar sekmelerinin içi */
.sub-nav{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:color-mix(in srgb,var(--ink) 7%,var(--bg));border-radius:9px;padding:2px;gap:2px}
.sub-nav a{text-align:center;padding:6px 8px;border-radius:7px;font-size:13px;font-weight:600;text-decoration:none;color:var(--muted);white-space:nowrap}
.sub-nav a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 .5px var(--line)}
.sub-nav a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chips.seg:has(a[href="#radar"]){display:none}
/* (i) açıklama düğmesi */
.info{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--muted);background:none;color:var(--muted);font:600 12px/1 var(--f-body);display:inline-grid;place-items:center;cursor:pointer;vertical-align:3px;margin-left:8px;padding:0}
.info[aria-expanded="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.info:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.logo{font-family:var(--f-body);font-weight:700;letter-spacing:-.02em}
.leader .big{font-size:24px;font-weight:700;line-height:1.15}
.phead .nm{font-size:26px;font-weight:700}
.hint.fold{display:none}
.hint.fold.open{display:block}
footer .in{padding-block:16px 0}

/* Aşama 2: skor tablosu, kategori şeridi, öne çıkanlar, ödüller */
.sb{display:flex;flex-direction:column;gap:2px}
.sbr{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;text-decoration:none;padding:2px 0}
.sbn{display:flex;align-items:baseline;gap:8px;min-width:0}
.sbr .nm{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sbr .ap{flex:none;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sbs{font-family:var(--f-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;min-width:20px;text-align:right}
.sbr.lo .nm{font-weight:400;color:var(--muted)}
.sbr.lo .sbs{font-weight:500;color:var(--muted)}
@media (max-width:420px){.sbn{flex-direction:column;gap:0}.sbr .ap{font-size:11.5px}}
.game summary{gap:12px;padding:14px 16px}
.mine{padding:14px 16px 4px;display:flex;flex-direction:column;gap:12px}
.strip{gap:4px}
.strip span{height:20px;border-radius:5px;font-family:var(--f-body);font-size:10px;font-weight:600}
.strip .H{background:color-mix(in srgb,var(--accent) 16%,var(--surface));color:var(--accent)}
.strip .A{background:color-mix(in srgb,var(--cool) 15%,var(--surface));color:var(--cool)}
.strip .cl{outline:0;box-shadow:inset 0 -2px 0 currentColor}
.wbl b{font-size:15px;font-weight:700}
.wbb{height:4px;border-radius:2px}
.wbb i{border-right:2px solid var(--surface)}
.gmeta{font-size:12.5px}
.heads{display:grid;gap:0;grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){.heads{grid-template-columns:1fr 1fr}.heads .head:nth-child(2){border-top:0}.heads .head:nth-child(even){border-left:.5px solid var(--line)}}
.heads .head{border-radius:0;background:none;padding:12px 16px;border-top:.5px solid var(--line)}
.heads .head:first-child{border-top:0}
.head .lab,.aw .lab{color:var(--muted);font-weight:500}
.head .t{font-weight:600}
.awards{gap:0;background:var(--surface);border-radius:12px;overflow:hidden;grid-template-columns:minmax(0,1fr)}
.aw{border-radius:0;border:0;border-top:.5px solid var(--line);padding:12px 16px}
