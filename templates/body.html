<main><div class="in" id="app"></div></main>
<footer><div class="in">Veri ESPN Fantasy'den, tamamlanan haftalar üzerinden her sabah otomatik hesaplanır. Devam eden hafta dahil değil.</div></footer>

<script>
const DATA=__DATA__;
const T=DATA.teams, byId=Object.fromEntries(T.map(t=>[t.id,t]));
const W=DATA.weeks, NW=W.length;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=x=>(x*100).toFixed(1);
const rec=r=>r[0]+'-'+r[1]+(r[2]?'-'+r[2]:'');
const link=t=>'#takim-'+t.id;
function logo(t,s){const ab=esc((t.abbrev||t.name).slice(0,3)).replace(/'/g,'');
  return `<span class="logo" style="width:${s}px;height:${s}px;font-size:${Math.round(s*.36)}px">${t.logo?`<img src="${esc(t.logo)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.textContent='${ab}'">`:ab}</span>`}
document.getElementById('meta').innerHTML=`<b>${DATA.current&&DATA.current.matchups.length?DATA.current.week+'. hafta oynanıyor':NW+'. hafta sonrası'}</b><br>${esc(DATA.updated)}`;

const power=[...T].sort((a,b)=>b.power-a.power);
const league=[...T].sort((a,b)=>b.catPct-a.catPct);
const pRank=t=>power.indexOf(t)+1, lRank=t=>league.indexOf(t)+1;
function movePill(t){const d=lRank(t)-pRank(t);
  return d>0?`<span class="pill up" title="Lig sırası ${lRank(t)}">▲${d}</span>`:d<0?`<span class="pill down" title="Lig sırası ${lRank(t)}">▼${-d}</span>`:`<span class="pill flat">=</span>`}
function mix(v,max,col){return `background:color-mix(in srgb,var(--${col}) ${Math.round(v/max*85)}%,var(--surface))`}

function awards(){
  const by=(k,dir=-1)=>[...T].sort((a,b)=>dir*(a[k]-b[k]))[0];
  const unl=by('luck',1),lucky=by('luck'),busy=by('adds'),sleepy=by('moves',1);
  const best=T.flatMap(t=>t.games.map(g=>({t,g}))).sort((a,b)=>b.g.beat-a.g.beat||a.g.w-b.g.w)[0];
  return [["En şanssız",unl,`${rec(unl.mrec)} ama all-play %${pct(unl.apPct)}`],
   ["En şanslı",lucky,`All-play'in ${pct(lucky.luck)} puan üstünde`],
   ["Kusursuz hafta",best.t,`${best.g.w}. haftada 11/11`],
   ["Transfer bağımlısı",busy,`${busy.adds} oyuncu aldı`],
   ["Uyuyan menajer",sleepy,`Sadece ${sleepy.moves} kadro hamlesi`]]
   .map(([l,t,w])=>`<a class="aw" href="${link(t)}">${logo(t,36)}<div><div class="lab">${l}</div><div class="who">${esc(t.name)}</div><div class="why">${esc(w)}</div></div></a>`).join('');
}

const H=DATA.history||{seasons:[],owners:[]};
const OW=Object.fromEntries(H.owners.map(o=>[o.key,o]));
const multi=H.seasons.length>1;
const sz=y=>(y-1)+'-'+String(y).slice(2);
function tags(t){const o=OW[t.owner];if(!o)return '';
  return (multi&&o.nSeasons===1?'<span class="newb">İlk sezonu</span>':'')+(o.oldNames.length?`<span class="old">Eski adı: ${o.oldNames.map(esc).join(', ')}</span>`:'')}
const V={};
const PF={q:'',pos:'',av:'all',sort:'val',mode:'val'};
function playerRows(){const q=PF.q.trim().toLocaleLowerCase('tr');
  let L=P.filter(p=>(!q||p.name.toLocaleLowerCase('tr').includes(q))&&(!PF.pos||p.pos===PF.pos)&&(PF.av==='all'||(PF.av==='fa'?p.team===0:p.team!==0)));
  const key=p=>PF.sort==='val'?(PF.mode==='valProj'?(p.valProj??-99):p[PF.mode]):p.z[PF.sort];
  L.sort((a,b)=>key(b)-key(a));
  const all=[...P].sort((a,b)=>b.val-a.val);const rk=new Map(all.map((p,i)=>[p.id,i+1]));
  const zc=v=>{const a=Math.min(1,Math.abs(v)/2.5);return v>=0?mix(a*6,6,'accent'):mix(a*6,6,'cool')};
  return L.slice(0,120).map(p=>{const t=p.team?byId[p.team]:null;const v=PF.mode==='valProj'?p.valProj:p[PF.mode];
    return `<tr><td class="pnm"><div class="pnw"><span class="prk">${rk.get(p.id)}</span><div><b>${esc(p.name)}</b>${p.inj?` <span class="pill down">${p.inj}</span>`:''}${p.valProj!=null&&p.valProj-p.valNow>=4.5?' <span class="pill up">Toparlanma</span>':''}<small>${p.pos} · ${p.min} dk · ${t?esc(t.abbrev||t.name):'<span class="pos">Serbest</span>'}</small></div></div></td>
     <td class="c val ${v>=0?'pos':'neg'}">${v==null?'–':zfmt(v)}</td>${DATA.cats.map(c=>`<td class="c" style="${zc(p.z[c])};${Math.abs(p.z[c])>=1.8?'color:#fff;':''}" title="${c}: ${fmt(c,p.s[c])} / maç">${zfmt(p.z[c])}</td>`).join('')}</tr>`}).join('')||`<tr><td colspan="11" class="hint" style="padding:14px">Bu filtreyle oyuncu yok.</td></tr>`}
V.oyuncular=()=>`<section class="sec"><h2>Oyuncu sıralaması</h2>
  <p class="hint">Fantezi değeri: oyuncunun 9 kategoride lig ortalamasına göre katkısının (z-skoru) toplamı. 0 ortalama oyuncu, +5 ve üstü çok değerli. Kategori hücreleri o kategorideki katkıyı gösterir; FG% ve FT%'de şut sayısı da hesaba katılır, TO'da az olan iyidir. Soldaki numara genel sıralama.</p>
  <div class="filters">
   <input id="pq" type="search" placeholder="Oyuncu ara" value="${esc(PF.q)}" aria-label="Oyuncu ara">
   <select id="pav" aria-label="Durum"><option value="all">Tüm oyuncular</option><option value="fa">Sadece serbest</option><option value="own">Sadece kadrolu</option></select>
   <select id="ppos" aria-label="Pozisyon"><option value="">Tüm pozisyonlar</option>${['PG','SG','SF','PF','C'].map(x=>`<option>${x}</option>`).join('')}</select>
   <select id="pmode" aria-label="Dönem"><option value="val">Karma değer</option><option value="valNow">Şu anki form</option><option value="valProj">Sezon öncesi projeksiyon</option></select>
   <select id="psort" aria-label="Sırala"><option value="val">Değere göre sırala</option>${DATA.cats.map(c=>`<option value="${c}">${c} katkısına göre</option>`).join('')}</select>
  </div>
  <div class="panel scroll"><table class="ptab"><thead><tr><th>Oyuncu</th><th>Değer</th>${DATA.cats.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody id="ptb">${playerRows()}</tbody></table></div>
  <p class="hint">En fazla 120 oyuncu listelenir. Kadrolar ve ESPN'de en çok sahiplenilen 200 serbest oyuncu dahil.</p></section>`;
const MYK='nbafan.team';
function getMy(){try{const v=localStorage.getItem(MYK);return v&&byId[+v]?+v:null}catch(e){return null}}
function setMy(v){try{v==null?localStorage.removeItem(MYK):localStorage.setItem(MYK,String(v))}catch(e){}}
let memMy=null;
const P=DATA.players||[];
const zfmt=v=>(v>=0?'+':'')+v.toFixed(1);
V.takimim=()=>{
  const my=getMy()??memMy;
  if(my==null){
    return `<div class="hero"><span class="live" style="--x:0">Kişisel öneriler</span><h2>Takımını seç</h2>
     <p class="hint">Takımını bir kez seç, bu cihaz hatırlasın. Haftalık maçın, kadron ve serbest oyuncu önerilerin burada görünecek. Giriş özelliği ileride gelecek.</p></div>
     <div class="tgrid">${[...T].sort((a,b)=>a.name.localeCompare(b.name,'tr')).map(t=>`<button type="button" class="tcard" data-pick="${t.id}">${logo(t,56)}<div class="nm">${esc(t.name)}</div><div class="sub">${rec(t.mrec)}</div></button>`).join('')}</div>`;
  }
  const t=byId[my];
  // this week
  const m=CUR.matchups.find(x=>x.home===my||x.away===my);
  let week='',chase=new Set(),protect=new Set();
  if(m){const home=m.home===my,o=byId[home?m.away:m.home];
    const rows=m.cats.map(k=>{const mine=home?k.h:k.a,their=home?k.a:k.h;
      const st=k.r==='T'?'tie':((k.r==='H')===home?'win':'loss');
      const q=m.proj?(home?m.proj.pc[k.c]:1-m.proj.pc[k.c]):null;
      const lab=q!=null?(q>=.85?'Güvende':q>=.5?'Koru':q>=.15?'Kovala':'Zor'):st==='win'?(k.close?'Koru':'Güvende'):st==='loss'?(k.close?'Kovala':'Zor'):'Berabere';
      const pj=q!=null?`<br><span class="pj">→ ${fmt(k.c,m.proj.mu[home?0:1][k.c])} – ${fmt(k.c,m.proj.mu[home?1:0][k.c])} · %${Math.round(q*100)}</span>`:'';
      if(lab==='Kovala'||lab==='Berabere')chase.add(k.c); if(lab==='Koru')protect.add(k.c);
      const cls=lab==='Güvende'?'up':lab==='Koru'?'flat':lab==='Zor'?'down':'chase';
      return `<tr><td class="${st==='win'?'win':'lose'}">${fmt(k.c,mine)}</td><td class="mid"><b>${k.c}</b>${pj}</td><td class="${st==='loss'?'win':'lose'}">${fmt(k.c,their)}</td><td><span class="pill ${cls}">${lab}</span></td></tr>`}).join('');
    const [w,l]=home?[m.score[0],m.score[1]]:[m.score[1],m.score[0]];
    const tips=[];
    if(m.proj){const wp=home?m.proj.win:1-m.proj.win,[g1,g2]=home?m.proj.games:[m.proj.games[1],m.proj.games[0]];
      tips.push(`Haftanın sonunda bu maçı kazanma ihtimalin <b>%${Math.round(wp*100)}</b>. Bu hafta kalan maç sayısı: sen <b>${g1}</b>, rakibin <b>${g2}</b>.${g1<g2-4?' Rakibin daha çok maç oynayacak; maçı olan serbest oyuncular kısa vadede işine yarar.':''}`)}
    if(chase.size)tips.push(`Dönebilecek, şu an kaybetmeye daha yakın olduğun kategoriler: <b>${[...chase].join(', ')}</b>. Waiver ve kadro kararlarını bunlara göre ver.`);
    if(protect.size)tips.push(`Önde ama garanti olmayan kategoriler: <b>${[...protect].join(', ')}</b>. Bunları kaybettirecek hamlelerden kaçın.`);
    if(protect.has('FG%')||protect.has('FT%'))tips.push('Yüzdelerde öndesin. Kötü şut yüzdeli oyuncuları yedekte tutmak yüzdeyi korur.');
    if(!tips.length)tips.push('Kıl payı kategori yok. Maç büyük ölçüde belli; gelecek haftayı düşünerek hamle yapabilirsin.');
    week=`<section class="sec"><div class="sec-h"><h2>Bu haftaki maçın</h2></div>
     <div class="panel"><div class="mu" style="padding:14px"><a class="side${l>w?' loser':''}" href="${link(t)}">${logo(t,40)}<div><div class="nm">${esc(t.name)}</div><div class="ap">${CUR.live[t.id]}/11 yeniyor</div></div></a>
      <div class="sc"><span class="${w>l?'w':''}">${w}</span>–<span class="${l>w?'w':''}">${l}</span></div>
      <a class="side r${w>l?' loser':''}" href="${link(o)}">${logo(o,40)}<div><div class="nm">${esc(o.name)}</div><div class="ap">${CUR.live[o.id]}/11 yeniyor</div></div></a></div>
      ${winbar(m,!home)}
      <table class="cats-t my"><tbody>${rows}</tbody></table>
      <div class="tips">${tips.map(x=>`<p>${x}</p>`).join('')}</div></div></section>`;
  }
  // roster
  const mine=P.filter(p=>p.team===my).sort((a,b)=>b.val-a.val);
  const healthy=mine.filter(p=>p.inj!=='Sakat'&&p.inj!=='IR'&&p.slot!=='IR');
  const drop=healthy[healthy.length-1];
  const topz=p=>Object.entries(p.z).sort((a,b)=>b[1]-a[1]);
  const maxV=Math.max(1,...P.map(p=>Math.abs(p.val)));
  const prow=(p,extra)=>{const z=topz(p),best=z.slice(0,2),worst=z[z.length-1];
    return `<div class="pl"><div class="pn"><div class="nm">${esc(p.name)}${p.inj?` <span class="pill down">${p.inj}</span>`:''}${p===drop?' <span class="pill flat">Bırakma adayı</span>':''}</div>
     <small>${p.pos}${p.slot?' · '+p.slot:''} · ${p.min} dk${p.left!=null?` · bu hafta ${p.left} maç`:''}${extra||''}</small>
     <small>Şu anki form ${zfmt(p.valNow)}${p.valProj!=null?` · Sezon öncesi projeksiyon ${zfmt(p.valProj)}`:''}${p.valProj!=null&&p.valProj-p.valNow>=4.5?' · <b class="pos">Toparlanma adayı</b>':''}${p.valProj!=null&&p.valNow-p.valProj>=4.5?' · <b class="neg">Beklentinin üstünde</b>':''}</small>
     <small>Güçlü: ${best.map(([c,v])=>`${c} ${zfmt(v)}`).join(', ')} · Zayıf: ${worst[0]} ${zfmt(worst[1])}</small></div>
     <div class="pv"><span class="${p.val>=0?'pos':'neg'}">${zfmt(p.val)}</span><span class="vbar"><i style="${p.val>=0?'left:50%':'right:50%'};width:${Math.min(50,Math.abs(p.val)/maxV*50)}%"></i></span></div></div>`};
  const roster=`<section class="sec"><h2>Kadron</h2><p class="hint">Değer: 9 kategorideki katkının toplamı (ligdeki oyunculara göre z-skoru, 0 ortalama oyuncu). Hesapta %50 son 15 gün, %30 sezon ortalaması, %20 ESPN'in sezon öncesi projeksiyonu var. \"Toparlanma adayı\" projeksiyonunun çok altında oynayan oyuncu demek.</p>
   <div class="panel">${mine.map(p=>prow(p)).join('')||'<p class="hint" style="padding:14px">Kadro verisi yok.</p>'}</div></section>`;
  // waiver
  const w={};DATA.cats.forEach(c=>{let x=1;const r=t.rank[c];if(r>=8)x+=.5;if(chase.has(c))x+=.75;if(r===12&&!chase.has(c))x=.4;w[c]=x});
  const focus=DATA.cats.filter(c=>w[c]>1.2);
  const fa=P.filter(p=>p.team===0&&p.gp>=3&&p.inj!=='Sakat'&&p.inj!=='IR').map(p=>({p,fit:DATA.cats.reduce((a,c)=>a+w[c]*p.z[c],0)})).sort((a,b)=>b.fit-a.fit).slice(0,8);
  const waiver=`<section class="sec"><h2>Serbest oyuncu önerileri</h2><p class="hint">${focus.length?`Odak kategorilerin: <b>${focus.join(', ')}</b> (zayıf olduğun ya da bu hafta kıl payı geride olduğun kategoriler). `:''}Sıralama bu kategorilere ekstra ağırlık veriyor.${drop?` Bırakma adayın <b>${esc(drop.name)}</b> (${zfmt(drop.val)}).`:''}</p>
   <div class="panel">${fa.map(({p,fit})=>prow(p,` · %${p.owned} sahiplik${drop&&p.val>drop.val?` · <b class="pos">${esc(drop.name)} yerine alınabilir</b>`:''}`)).join('')}</div></section>`;
  return `<div class="phead">${logo(t,64)}<div><div class="nm">${esc(t.name)}</div><div class="sub">Güç sıralaması #${pRank(t)} · ${rec(t.mrec)} · <button type="button" class="linkbtn" data-unpick>Takımı değiştir</button></div></div></div>${week}${myOdds(t)}${roster}${waiver}
   <p class="hint">Öneriler ESPN verisine dayanan istatistiksel tahminlerdir; maç takvimi ve sakatlık haberlerini de kontrol et.</p>`};
const CUR=DATA.current||{matchups:[],live:{}};
function myOdds(t){const r=SIM&&SIM.teams[t.id];if(!r)return '';const cr=[...T].filter(x=>SIM.teams[x.id]).sort((a,b)=>SIM.teams[b.id].champ-SIM.teams[a.id].champ).findIndex(x=>x.id===t.id)+1;
  return `<section class="sec"><div class="sec-h"><h2>Sezon tahmini</h2><a class="back" href="#siralama" style="color:var(--accent)">Tüm lig ›</a></div>
  <div class="tiles"><div class="tile"><span class="k">Playoff</span><span class="v">%${op(r.po)}</span><span class="s">${r.seed?`Ortalama sıra ${r.seed.toFixed(1)}`:'İlk 8 dışında'}</span></div>
  <div class="tile"><span class="k">Final</span><span class="v">%${op(r.final)}</span><span class="s">Lig ${SIM.playoffTeams} takımlı playoff</span></div>
  <div class="tile"><span class="k">Şampiyonluk</span><span class="v">%${op(r.champ)}</span><span class="s">Ligde ${cr}. favori</span></div>
  <div class="tile"><span class="k">Tahmini kategori</span><span class="v">${Math.round(r.w)}-${Math.round(r.l)}</span><span class="s">Normal sezon sonu</span></div></div></section>`}
function liveRank(){return [...T].filter(t=>CUR.live[t.id]!=null).sort((a,b)=>CUR.live[b.id]-CUR.live[a.id])}
function fmt(c,v){return c.includes('%')?v.toFixed(3).replace(/^0/,''):String(Math.round(v))}
function winbar(m,flip){if(!m.proj)return '';const P=m.proj,p=flip?1-P.win:P.win,h=byId[flip?m.away:m.home],a=byId[flip?m.home:m.away];
  const sc=flip?[P.score[1],P.score[0]]:P.score,g=flip?[P.games[1],P.games[0]]:P.games;
  return `<div class="wb"><div class="wbl"><span><b>%${Math.round(p*100)}</b> ${esc(h.abbrev||'')}</span><span class="wbm">Tahmini son: ${sc[0]}-${sc[1]} · kalan maç ${g[0]}–${g[1]}</span><span>${esc(a.abbrev||'')} <b>%${Math.round((1-p)*100)}</b></span></div><div class="wbb"><i style="width:${(p*100).toFixed(1)}%"></i></div></div>`}
V['bu-hafta']=()=>{
  const ms=CUR.matchups; if(!ms.length) return V.siralama();
  const lr=liveRank(), top=lr[0], low=lr[lr.length-1];
  const closest=ms[0].proj?[...ms].sort((a,b)=>Math.abs(a.proj.win-.5)-Math.abs(b.proj.win-.5))[0]:ms[0], blow=[...ms].sort((a,b)=>Math.abs(b.score[0]-b.score[1])-Math.abs(a.score[0]-a.score[1]))[0];
  const nm=id=>esc(byId[id].name);
  const sc=m=>m.score[0]+'-'+m.score[1]+(m.score[2]?'-'+m.score[2]:'');
  const leaderOf=m=>m.score[0]>m.score[1]?m.home:m.score[1]>m.score[0]?m.away:null;
  const heads=[
    ["Haftanın formda takımı",top,`${CUR.live[top.id]}/11 rakibi yeniyor`],
    ["En yakın maç",byId[closest.home],`${nm(closest.home)} ${sc(closest)} ${nm(closest.away)}`],
    ["Ezici üstünlük",byId[leaderOf(blow)||blow.home],`${nm(blow.home)} ${sc(blow)} ${nm(blow.away)}`],
    ["Zor hafta",low,`Şu an sadece ${CUR.live[low.id]}/11 rakibi yenebiliyor`]];
  const game=m=>{const h=byId[m.home],a=byId[m.away],[w,l]=m.score;
    const flips=m.cats.filter(k=>k.close).map(k=>k.c);
    return `<details class="game"><summary>
     <div class="mu"><a class="side${l>w?' loser':''}" href="${link(h)}">${logo(h,40)}<div><div class="nm">${esc(h.name)}</div><div class="ap">${CUR.live[h.id]}/11 yeniyor</div></div></a>
     <div class="sc"><span class="${w>l?'w':''}">${w}</span>–<span class="${l>w?'w':''}">${l}</span></div>
     <a class="side r${w>l?' loser':''}" href="${link(a)}">${logo(a,40)}<div><div class="nm">${esc(a.name)}</div><div class="ap">${CUR.live[a.id]}/11 yeniyor</div></div></a></div>
     <div class="strip" aria-label="Kategori durumu">${m.cats.map(k=>`<span class="${k.r}${k.close?' cl':''}" title="${k.c}: ${fmt(k.c,k.h)} – ${fmt(k.c,k.a)}">${k.c}</span>`).join('')}</div>
     ${winbar(m)}
     <div class="gmeta"><span>${flips.length?`Kıl payı: ${flips.join(', ')}`:'Kıl payı kategori yok'}</span><span class="more">Detay</span></div>
    </summary>
    <table class="cats-t"><thead><tr><td>Şu an</td><td class="mid">${m.proj?'Tahmini son · ihtimal':''}</td><td>Şu an</td></tr></thead><tbody>${m.cats.map(k=>{const q=m.proj&&m.proj.pc[k.c];return `<tr><td class="${k.r==='H'?'win':'lose'}">${fmt(k.c,k.h)}</td><td class="mid"><b>${k.c}</b>${m.proj?`<br><span class="pj">${fmt(k.c,m.proj.mu[0][k.c])} – ${fmt(k.c,m.proj.mu[1][k.c])}</span><br><span class="pj">%${Math.round(q*100)} – %${Math.round((1-q)*100)}</span>`:(k.close?' <span class="cl">● yakın</span>':'')}</td><td class="${k.r==='A'?'win':'lose'}">${fmt(k.c,k.a)}</td></tr>`}).join('')}</tbody></table>
    </details>`};
  return `<div class="hero"><span class="live">${CUR.week}. hafta · devam ediyor</span><h2>Bu haftanın durumu</h2>
   <p class="hint">Skorlar ${esc(DATA.updated)} itibarıyla. Şerit kategorilerin şu anki durumunu, altındaki çubuk haftanın sonu için kazanma ihtimalini gösterir. Tahmin, oyuncuların bu hafta kalan NBA maçlarına ve ortalamalarına dayanır.</p></div>
  <div class="heads">${heads.map(([l,t,s])=>`<a class="panel head" href="${link(t)}">${logo(t,44)}<div><div class="lab">${l}</div><div class="t">${esc(t.name)}</div><div class="s">${s}</div></div></a>`).join('')}</div>
  <section class="sec"><div class="sec-h"><h2>Maçlar</h2></div>
   <div class="panel">${ms.map(game).join('')}</div></section>
  <div class="two">
   <section class="sec"><h2>Haftanın all-play'i</h2><p class="hint">Bu haftaki kategorilerle kaç rakip yeniliyor.</p>
    <ol class="panel mini">${lr.map((t,i)=>`<li><a href="${link(t)}"><span class="n">${i+1}</span>${logo(t,32)}<span class="nm">${esc(t.name)}</span><span class="v">${CUR.live[t.id]}/11</span></a></li>`).join('')}</ol></section>
   <section class="sec"><h2>Sezon özeti</h2><p class="hint">Güç sıralamasının ilk beşi. Tamamı Sıralama sekmesinde.</p>
    <ol class="panel mini">${power.slice(0,5).map((t,i)=>`<li><a href="${link(t)}"><span class="n">${i+1}</span>${logo(t,32)}<span class="nm">${esc(t.name)}</span><span class="v">${rec(t.mrec)}</span></a></li>`).join('')}</ol>
    <a class="back" href="#siralama" style="color:var(--accent)">Tüm sıralama ›</a></section>
  </div>`};
V.siralama=()=>{const top=power[0];
  return `<a class="panel leader" href="${link(top)}">${logo(top,64)}<div><div class="lab">Güç sıralaması lideri</div><div class="big">${esc(top.name)}</div><div class="why">All-play %${pct(top.apPct)} · ${NW} haftada ${top.weekly.reduce((a,b)=>a+b,0)} rakip yendi</div></div></a>
  <section class="sec"><div class="sec-h"><h2>Güç sıralaması</h2></div>
  <p class="hint">%60 sezon boyu all-play gücü, %40 son iki haftanın formu. Sağdaki ok, takımın gerçek lig sırasına göre farkını gösterir.</p>
  <ol class="panel rank-list">${power.map((t,i)=>`<li><a class="trow" href="${link(t)}"><span class="n">${i+1}</span>${logo(t,40)}
   <div style="min-width:0"><div class="nm">${esc(t.name)}${tags(t)}</div><div class="sub"><span>${rec(t.mrec)}</span><span>${t.cat.join('-')}</span><span>AP %${pct(t.apPct)}</span></div></div>
   <div class="side">${movePill(t)}<span class="pbar"><i style="width:${(t.power/top.power*100).toFixed(0)}%"></i></span></div></a></li>`).join('')}</ol></section>
  ${V.playoff()}
  <section class="sec"><h2>Ödüller</h2><div class="awards">${awards()}</div></section>${V.sans()}`};
const SIM=DATA.sim||null;
const op=x=>x>=.995?'100':x<.005?(x>0?'<1':'0'):String(Math.round(x*100));
const heat=(x,col)=>`background:color-mix(in srgb,var(--${col}) ${Math.round(Math.sqrt(x)*38)}%,transparent)`;
V.playoff=()=>{if(!SIM)return '';const S=SIM.teams;
  const rows=T.filter(t=>S[t.id]).sort((a,b)=>S[b.id].champ-S[a.id].champ||S[b.id].po-S[a.id].po);
  return `<section class="sec" id="playoff"><div class="sec-h"><h2>Playoff ve şampiyonluk ihtimalleri</h2></div>
  <p class="hint">Sezonun kalanı ve playofflar ${SIM.sims.toLocaleString('tr-TR')} kez simüle edildi. İlk ${SIM.playoffTeams} takım playoffa kalır, sıralama kategori galibiyetlerine göre yapılır, eşleşmeler 1-8, 4-5, 2-7, 3-6 ve her tur bir hafta. Takım gücü sezon boyu haftalık kategori ortalamaları ile şu anki kadronun projeksiyonunun karışımı. İsmin altında tahmini sezon sonu kategori skoru ve ortalama playoff sırası var.</p>
  <div class="panel odds"><div class="orow oh"><span></span><span>Takım</span><span>Playoff</span><span>Final</span><span>Şamp.</span></div>
  ${rows.map(t=>{const r=S[t.id];return `<a class="orow" href="${link(t)}">${logo(t,28)}<div style="min-width:0"><div class="nm">${esc(t.name)}</div><div class="sub">${Math.round(r.w)}-${Math.round(r.l)}${r.seed?` · sıra ${r.seed.toFixed(1)}`:''}</div></div>
   <span class="ov" style="${heat(r.po,'accent')}">%${op(r.po)}</span><span class="ov" style="${heat(r.final,'accent')}">%${op(r.final)}</span><span class="ov b" style="${heat(r.champ,'accent')}">%${op(r.champ)}</span></a>`}).join('')}</div></section>`};

V.sans=()=>{const lk=[...T].sort((a,b)=>b.luck-a.luck),M=0.2;
  const ev=(x,lost)=>{const t=T.find(z=>z.name===x.team);return `<a class="ev" href="${link(t)}" style="text-decoration:none">${logo(t,36)}<div style="min-width:0"><div class="nm">${esc(x.team)}</div><small>H${x.w} · ${lost?'kaybetti':'yendi'}: ${esc(x.opp)} · ${x.beat}/11</small></div><span class="sc">${x.score}</span></a>`};
  return `<section class="sec"><h2>Şans endeksi</h2>
  <p class="hint">Gerçek kategori oranı eksi all-play oranı. All-play: takım her hafta 11 rakibin hepsiyle oynasaydı kazanacağı kategori oranı. Yeşil fikstürden kazançlı çıktı, kırmızı hak ettiğini alamadı.</p>
  <div class="panel luck">${lk.map(t=>{const v=t.luck,w=Math.min(Math.abs(v)/M,1)*50;
    const st=v>=0?`left:50%;width:${w}%;background:var(--good)`:`left:${50-w}%;width:${w}%;background:var(--bad)`;
    return `<a class="lrow" href="${link(t)}">${logo(t,28)}<span class="nm">${esc(t.name)}</span><span class="v">${v>=0?'+':''}${pct(v)}</span><span class="bar"><i style="${st}"></i></span></a>`}).join('')}
   <div class="axis"><span>−20 puan</span><span>0</span><span>+20 puan</span></div></div></section>
  <section class="sec"><h2>Kötü talih</h2><p class="hint">Ligin çoğunu yenecek kadar iyi oynayıp yine de kaybedilen maçlar.</p>
   <div class="panel">${DATA.beats.map(x=>ev(x,1)).join('')||'<p class="hint" style="padding:14px">Henüz yok.</p>'}</div></section>
  <section class="sec"><h2>Soygunlar</h2><p class="hint">O hafta ligin en zayıflarındanken kazanılan maçlar.</p>
   <div class="panel">${DATA.steals.map(x=>ev(x,0)).join('')||'<p class="hint" style="padding:14px">Henüz yok.</p>'}</div></section>`};

let selWeek=W[NW-1];
V.haftalar=()=>{
  const seen=new Set(),mus=[];
  T.forEach(t=>t.games.filter(g=>g.w===selWeek).forEach(g=>{const k=[t.id,g.oppId].sort().join('-');if(seen.has(k))return;seen.add(k);mus.push([t,g])}));
  mus.sort((a,b)=>(b[1].beat+byId[b[1].oppId].weekly[selWeek-1])-(a[1].beat+byId[a[1].oppId].weekly[selWeek-1]));
  const hw=[...T].sort((a,b)=>b.apPct-a.apPct);
  return `<section class="sec"><h2>Maçlar</h2>
  <div class="chips" role="group" aria-label="Hafta seç">${W.map(w=>`<button type="button" data-w="${w}" aria-pressed="${w===selWeek}">${w}. hafta</button>`).join('')}</div>
  <div class="panel">${mus.map(([t,g])=>{const o=byId[g.oppId],[a,b]=g.score.split('-').map(Number),win=g.res==='G',loss=g.res==='M';
    return `<div class="mu"><a class="side${loss?' loser':''}" href="${link(t)}">${logo(t,36)}<div><div class="nm">${esc(t.name)}</div><div class="ap">${g.beat}/11 yenerdi</div></div></a>
    <div class="sc"><span class="${win?'w':''}">${a}</span>–<span class="${loss?'w':''}">${b}</span></div>
    <a class="side r${win?' loser':''}" href="${link(o)}">${logo(o,36)}<div><div class="nm">${esc(o.name)}</div><div class="ap">${o.weekly[selWeek-1]}/11 yenerdi</div></div></a></div>`}).join('')}</div>
  <p class="hint">"x/11 yenerdi": takımın o haftaki kategorileriyle 11 rakibin kaçını yeneceği.</p></section>
  <section class="sec"><h2>Haftalık all-play</h2><p class="hint">Her hafta yenilecek rakip sayısı. Çerçeveli hücre gerçek maçın kaybedildiği hafta.</p>
  <div class="panel scroll"><table><thead><tr><th>Takım</th>${W.map(w=>`<th>H${w}</th>`).join('')}<th>Top.</th></tr></thead><tbody>
  ${hw.map(t=>`<tr><td class="tn">${esc(t.name)}</td>${t.games.map(g=>`<td class="c" style="${mix(g.beat,11,'accent')};${g.beat>6?'color:#fff;':''}${g.res==='M'?'box-shadow:inset 0 0 0 2px var(--ink)':''}" title="${esc(g.opp)} ${g.score}">${g.beat}</td>`).join('')}<td class="c">${t.weekly.reduce((a,b)=>a+b,0)}</td></tr>`).join('')}
  </tbody></table></div></section>`};

function allTime(){if(!H.owners.length)return '';
  const rows=H.owners.map(o=>{const t=o.teamId!=null?byId[o.teamId]:null;
    const nm=`<b>${esc(o.name)}</b>${multi&&o.active&&o.nSeasons===1?'<span class="newb">İlk sezonu</span>':''}${o.oldNames.length?`<span class="old">Eski adı: ${o.oldNames.map(esc).join(', ')}</span>`:''}${!o.active?'<span class="old">Artık ligde değil</span>':''}`;
    return `<tr class="${o.active?'':'gone'}"><td>${t?`<a href="${link(t)}" style="text-decoration:none">${nm}</a>`:nm}</td><td>${o.nSeasons}</td><td>${rec(o.mrec)}</td><td>%${pct(o.catPct)}</td><td>%${pct(o.apPct)}</td><td>${o.titles?`<span class="champ">${o.titles}× şampiyon</span>`:o.best?o.best+'.':'–'}</td></tr>`}).join('');
  return `<section class="sec"><h2>Tüm zamanlar</h2><p class="hint">${multi?`${H.seasons.map(sz).join(' ve ')} sezonları, kullanıcıya göre birleştirildi. İsmi değişen takımların eski adları küçük yazıyla görünür.`:'Şimdilik sadece bu sezon var. Geçmiş sezonlar yüklenince burada birleşecek.'} Sıralama kategori kazanma oranına göre; derece sadece tamamlanan sezonlardan.</p>
  <div class="panel scroll"><table class="hist"><thead><tr><th>Menajer</th><th>Sezon</th><th>Maç</th><th>Kat. %</th><th>All-play</th><th>En iyi</th></tr></thead><tbody>${rows}</tbody></table></div></section>`}
V.takimlar=()=>{const hw=[...T].sort((a,b)=>pRank(a)-pRank(b));
  return `<section class="sec"><h2>Bu sezonun takımları</h2><div class="tgrid">${hw.map(t=>`<a class="tcard" href="${link(t)}">${logo(t,56)}<div class="nm">${esc(t.name)}${tags(t)}</div><div class="sub">${rec(t.mrec)} · ${t.cat.join('-')}</div></a>`).join('')}</div></section>
  ${allTime()}
  <section class="sec"><h2>Kategori profili</h2><p class="hint">Her kategoride lig sırası (1 en iyi; TO'da en az olan 1). Turuncu güçlü, mavi zayıf. Punt edilen kategoriler buradan görünür.</p>
  <div class="panel scroll"><table><thead><tr><th>Takım</th>${DATA.cats.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>
  ${hw.map(t=>`<tr><td class="tn">${esc(t.name)}</td>${DATA.cats.map(c=>{const r=t.rank[c];return `<td class="c" style="${r<=6?mix(7-r,6,'accent'):mix(r-6,6,'cool')};${(r<=2||r>=11)?'color:#fff;font-weight:600':''}">${r}</td>`}).join('')}</tr>`).join('')}
  </tbody></table></div></section>`};

function radar(t){const C=DATA.cats,n=C.length,cx=170,cy=150,R=105;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]};
  const rings=[.25,.5,.75,1].map(f=>`<polygon points="${C.map((_,i)=>pt(i,R*f).join(',')).join(' ')}" fill="none" stroke="var(--line)"/>`).join('');
  const spokes=C.map((_,i)=>`<line x1="${cx}" y1="${cy}" x2="${pt(i,R)[0]}" y2="${pt(i,R)[1]}" stroke="var(--line)"/>`).join('');
  const val=c=>(13-t.rank[c])/12;
  const poly=C.map((c,i)=>pt(i,R*val(c)).join(',')).join(' ');
  const dots=C.map((c,i)=>{const [x,y]=pt(i,R*val(c));return `<circle cx="${x}" cy="${y}" r="3.5" fill="var(--accent)"/>`}).join('');
  const labels=C.map((c,i)=>{const [x,y]=pt(i,R+24);const r=t.rank[c];return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" class="${r<=3?'lbl-strong':''}">${c} ${r}.</text>`}).join('');
  return `<svg viewBox="0 0 340 300" role="img" aria-label="Kategori sıraları">${rings}${spokes}<polygon points="${poly}" fill="color-mix(in srgb,var(--accent) 25%,transparent)" stroke="var(--accent)" stroke-width="2"/>${dots}${labels}</svg>`}

function profile(id){const t=byId[id];if(!t)return V.siralama();
  const strong=DATA.cats.filter(c=>t.rank[c]<=3),weak=DATA.cats.filter(c=>t.rank[c]>=10);
  return `<a class="back" href="#takimlar">‹ Takımlar</a>
  <div class="phead">${logo(t,72)}<div><div class="nm">${esc(t.name)}</div>${tags(t)}<div class="sub">Güç sıralaması #${pRank(t)} · Lig sırası #${lRank(t)}</div></div></div>
  <div class="tiles">
   <div class="tile"><span class="k">Maç</span><span class="v">${rec(t.mrec)}</span><span class="s">haftalık galibiyet</span></div>
   <div class="tile"><span class="k">Kategori</span><span class="v">${t.cat.join('-')}</span><span class="s">%${pct(t.catPct)}</span></div>
   <div class="tile"><span class="k">All-play</span><span class="v">%${pct(t.apPct)}</span><span class="s">${t.ap.join('-')}</span></div>
   <div class="tile"><span class="k">Şans</span><span class="v" style="color:var(--${t.luck>=0?'good':'bad'})">${t.luck>=0?'+':''}${pct(t.luck)}</span><span class="s">puan</span></div>
  </div>
  <section class="sec"><h2>Kategori profili</h2>
   <p class="hint">${strong.length?`Güçlü: ${strong.join(', ')}.`:''} ${weak.length?`Zayıf: ${weak.join(', ')}.`:''} Dışa doğru gittikçe ligde daha iyi.</p>
   <div class="panel radar">${radar(t)}</div></section>
  <section class="sec"><h2>Haftalar</h2><div class="panel">${t.games.map(g=>{const o=byId[g.oppId];
   return `<a class="res" href="${link(o)}"><span class="wk">H${g.w}</span>${logo(o,32)}<div style="min-width:0"><div class="nm">${esc(o.name)}</div><small>${g.beat}/11 rakibi yenerdi</small></div><span class="sc">${g.score}<span class="gm ${g.res}">${g.res}</span></span></a>`}).join('')}</div></section>
  ${(()=>{const o=OW[t.owner];if(!o)return '';
    const opp=Object.entries(o.h2h).map(([k,r])=>[OW[k],r]).filter(x=>x[0]).sort((a,b)=>(b[1][0]-b[1][1])-(a[1][0]-a[1][1]));
    const seasons=multi?`<section class="sec"><h2>Sezonlar</h2><div class="panel">${o.seasons.map(se=>`<div class="res" style="grid-template-columns:64px minmax(0,1fr) auto"><span class="wk">${sz(se.y)}</span><div style="min-width:0"><div class="nm">${esc(se.name)}</div><small>Kategori ${se.cat.join('-')} · all-play %${pct(se.apPct)}</small></div><span class="sc">${se.final?(se.final===1?'<span class="champ">Şampiyon</span>':se.final+'.'):'devam'}<span class="gm B">${rec(se.mrec)}</span></span></div>`).join('')}</div></section>`:'';
    return seasons+`<section class="sec"><h2>Rakip geçmişi</h2><p class="hint">${multi?'Tüm sezonlarda':'Bu sezon'} bu rakiplerle oynanan maçlar.</p><div class="panel">${opp.map(([r,x])=>{const rt=r.teamId!=null?byId[r.teamId]:null;
      return `<div class="res" style="grid-template-columns:32px minmax(0,1fr) auto">${rt?logo(rt,32):'<span></span>'}<div style="min-width:0"><div class="nm">${esc(r.name)}</div>${r.oldNames.length?`<span class="old">Eski adı: ${r.oldNames.map(esc).join(', ')}</span>`:''}</div><span class="sc">${x[0]}-${x[1]}${x[2]?'-'+x[2]:''}<span class="gm ${x[0]>x[1]?'G':x[1]>x[0]?'M':'B'}">${x[0]>x[1]?'G':x[1]>x[0]?'M':'B'}</span></span></div>`}).join('')}</div></section>`})()}
  <div class="tiles">
   <div class="tile"><span class="k">Oyuncu alımı</span><span class="v">${t.adds}</span></div>
   <div class="tile"><span class="k">Kadro hamlesi</span><span class="v">${t.moves}</span></div>
   <div class="tile"><span class="k">Takas</span><span class="v">${t.trades}</span></div>
   <div class="tile"><span class="k">En iyi hafta</span><span class="v">${Math.max(...t.weekly)}/11</span></div>
  </div>`}

/*__FUN__*/
const app=document.getElementById('app');
function render(){const h=(location.hash||'#bu-hafta').slice(1);
  let v=h.startsWith('takim-')?'takimlar':h==='sans'?'siralama':(V[h]?h:'bu-hafta');
  app.innerHTML=`<div class="view">${h.startsWith('takim-')?profile(+h.slice(6)):V[v]()}</div>`;
  document.querySelectorAll('nav.tabs a').forEach(a=>{if(a.dataset.v===v)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  app.querySelectorAll('.chips button[data-w]').forEach(b=>b.onclick=()=>{selWeek=+b.dataset.w;render()});
  app.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{const el=document.getElementById(b.dataset.jump);if(el)window.scrollTo({top:el.getBoundingClientRect().top+scrollY-70,behavior:'smooth'})});
  const pq=document.getElementById('pq');
  if(pq){const sel={pav:'av',ppos:'pos',pmode:'mode',psort:'sort'};
    for(const [id,k] of Object.entries(sel)){const el=document.getElementById(id);el.value=PF[k];el.onchange=()=>{PF[k]=el.value;document.getElementById('ptb').innerHTML=playerRows()}}
    pq.oninput=()=>{PF.q=pq.value;document.getElementById('ptb').innerHTML=playerRows()}}
  app.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{memMy=+b.dataset.pick;setMy(memMy);render();window.scrollTo(0,0)});
  app.querySelectorAll('[data-unpick]').forEach(b=>b.onclick=()=>{memMy=null;setMy(null);render()});
}
let lastHash=location.hash;
window.addEventListener('hashchange',()=>{render();if(!location.hash.startsWith('#takim-')||lastHash!==location.hash)window.scrollTo(0,0);lastHash=location.hash});
render();
</script>
